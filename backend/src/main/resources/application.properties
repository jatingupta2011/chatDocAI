vaadin.launch-browser=true
spring.application.name=backend
server.port=${PORT:8080} #Railway

##############################
# OpenRouter Configuration
##############################

spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.base-url=https://openrouter.ai/api

spring.ai.openai.chat.options.model=openai/gpt-oss-20b:free

spring.ai.openai.embedding.enabled=true

spring.ai.openai.embedding.options.model=nvidia/llama-nemotron-embed-vl-1b-v2:free


##############################
# Chroma Configuration
##############################

spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.vectorstore.chroma.collection-name=chatdoc
spring.ai.vectorstore.chroma.tenant-name=SpringAiTenant
spring.ai.vectorstore.chroma.database-name=SpringAiDatabase

##############################
# Embeddings Configurations
##############################

chatdoc.retrieval.top-k=4
chatdoc.retrieval.similarity-threshold=0

chatdoc.chunking.chunk-size=800
chatdoc.chunking.overlap=150


